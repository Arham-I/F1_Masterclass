# Does FastF1 work from GitHub's runners at all?
#
# ANSWER (checked 2026-09-29, run 36537370429): NO.
#   HTTP 403  livetiming.formula1.com   <- the lap/timing feed FastF1 needs for everything here
#   HTTP 200  api.jolpi.ca (Ergast)     <- classifications only, not lap-level timing
#   HTTP 200  www.formula1.com
# F1 blocks datacenter address ranges, so no cloud CI can pull session data and the scheduled
# updates have to run somewhere with a residential IP (see docs/season-checklist.md).
#
# There are now TWO barriers, and this probe only ever tested the first:
#   1. the datacenter-IP block above (403), and
#   2. since October 2026, livetiming requires a Formula 1 account with an F1TV Access (or higher)
#      subscription - archived sessions included, not just the live feed. Unauthenticated requests
#      get 401 from anywhere, residential IPs too. FastF1 3.9+ signs in with F1_USERNAME/
#      F1_PASSWORD; this workflow passes neither, so a 401 here says nothing about the IP block.
# Opening the feed to datacenter IPs would therefore no longer be enough on its own: running this
# in CI for real would mean putting F1TV credentials in repository secrets.
#
# Kept so the finding can be re-checked rather than re-argued: run it by hand if F1 ever opens the
# feed up. It writes nothing.
name: FastF1 probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Upstream reachability
        continue-on-error: true
        run: |
          for url in \
            "https://livetiming.formula1.com/static/2026/2026-09-26_Azerbaijan_Grand_Prix/2026-09-25_Qualifying/SessionInfo.json" \
            "https://api.jolpi.ca/ergast/f1/2026/15/results.json" \
            "https://www.formula1.com/" ; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url" || echo "curl-failed")
            echo "HTTP $code  $url"
          done

      - name: Load a finished session with FastF1 logging on
        run: |
          python - <<'PY'
          import logging, sys, traceback, warnings
          warnings.filterwarnings("ignore")
          logging.basicConfig(level=logging.DEBUG, stream=sys.stdout,
                              format="%(levelname)s %(name)s: %(message)s")
          from f1cc import data
          data._setup()
          logging.getLogger("fastf1").setLevel(logging.DEBUG)   # _setup quietens it

          print(f"schedule: {len(data.get_schedule(2026))} rounds")
          try:
              s = data.load_session(2026, 15, "Qualifying")
              print(f"\nPASS  {len(s.laps)} laps, {len(s.results)} classified")
              print("\nFastF1 works from GitHub Actions.")
          except Exception:
              traceback.print_exc()
              print("\nFastF1 does NOT work from GitHub Actions; keep the updates on a local timer.")
              raise SystemExit(1)
          PY
